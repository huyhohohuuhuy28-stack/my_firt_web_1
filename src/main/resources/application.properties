spring.application.name=myfirstweb

# ===== H2 Database - khong can MySQL =====
# Database duoc luu thanh file trong thu muc data/
spring.datasource.url=jdbc:h2:file:./data/car_rental_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tu dong tao/cap nhat bang theo Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (neu can xem database tren trinh duyet)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
server.port=8080
