<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Người sử dụng</title>
      <link
         href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
         rel="stylesheet"
      />
      <nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
         <div class="container">
            <a class="navbar-brand" th:href="@{/}">🚗 Quản lý thuê xe</a>
            <div class="navbar-nav">
               <a class="nav-link" th:href="@{/vehicles}">Quản lý xe</a>
               <a class="nav-link" th:href="@{/customers}">Người sử dụng</a>
            </div>
         </div>
      </nav>
   </head>
   <body>
      <div class="container">
         <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Người sử dụng</h2>
            <a class="btn btn-success" th:href="@{/customers/add}"
               >+ Thêm người sử dụng</a
            >
         </div>
         <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
               <tr>
                  <th>ID</th>
                  <th>Họ tên</th>
                  <th>Số điện thoại</th>
                  <th>Email</th>
                  <th>Thao tác</th>
               </tr>
            </thead>
            <tbody>
               <tr th:each="c : ${customers}">
                  <td th:text="${c.id}"></td>
                  <td th:text="${c.name}"></td>
                  <td th:text="${c.phone}"></td>
                  <td th:text="${c.email}"></td>
                  <td class="text-nowrap">
                     <a
                        class="btn btn-sm btn-warning"
                        th:href="@{/customers/edit/{id}(id=${c.id})}"
                        >Sửa</a
                     >
                     <!-- Nút xóa trực tiếp không qua form -->
                     <a
                        class="btn btn-sm btn-danger ms-1"
                        th:href="@{/customers/delete(id=${c.id})}"
                        onclick="return confirm('Bạn có chắc muốn xóa người dùng này?')"
                        >Xóa</a
                     >
                  </td>
               </tr>
               <tr th:if="${#lists.isEmpty(customers)}">
                  <td colspan="5" class="text-center">
                     Chưa có người sử dụng.
                  </td>
               </tr>
            </tbody>
         </table>
      </div>
   </body>
</html>
