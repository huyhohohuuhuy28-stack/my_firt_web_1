<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý hợp đồng thuê xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">🚗 Quản lý thuê xe</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/vehicles}">Quản lý xe</a>
                <a class="nav-link" th:href="@{/customers}">Người sử dụng</a>
                <a class="nav-link active" th:href="@{/RentalManager}">Hợp đồng thuê xe</a>
            </div>
        </div>
    </nav>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Quản lý thuê xe</h2>
            <p class="text-muted mb-0">Quản lý các hợp đồng thuê xe trong hệ thống.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/RentalManager/add}">+ Tạo hợp đồng</a>
    </div>

    <!-- Thống kê -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1">Tổng hợp đồng</p>
                        <h3 class="fw-bold mb-0" th:text="${totalContracts}">0</h3>
                    </div>
                    <div class="fs-1">📋</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1">Đang thuê</p>
                        <h3 class="fw-bold text-primary mb-0" th:text="${rentingCount}">0</h3>
                    </div>
                    <div class="fs-1">🚗</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1">Đã trả xe</p>
                        <h3 class="fw-bold text-success mb-0" th:text="${returnedCount}">0</h3>
                    </div>
                    <div class="fs-1">✅</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bảng Hợp Đồng -->
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Mã HD</th>
                        <th>Khách hàng</th>
                        <th>Xe</th>
                        <th>Ngày thuê</th>
                        <th>Ngày trả</th>
                        <th>Trạng thái</th>
                        <th>Chi phí</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c, stat : ${contracts}">
                        <td th:text="${stat.count}"></td>
                        <td><strong th:text="${c.contractId}"></strong></td>
                        <td th:text="${c.customerName}"></td>
                        <td th:text="${c.licensePlate}"></td>
                        <td th:text="${c.rentalDate}"></td>
                        <td th:text="${c.expectedReturnDate}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${c.status == 'Đã trả' ? 'bg-success' : 'bg-primary'}"
                                  th:text="${c.status}"></span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(c.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        <td class="text-center text-nowrap">
                            <a th:if="${c.status == 'Đang thuê'}"
                               class="btn btn-sm btn-success me-1"
                               th:href="@{/RentalManager/return(id=${c.contractId})}"
                               onclick="return confirm('Xác nhận trả xe?')">Trả xe</a>
                            <a class="btn btn-sm btn-danger"
                               th:href="@{/RentalManager/delete(id=${c.contractId})}"
                               onclick="return confirm('Bạn có chắc muốn xóa hợp đồng này?')">Xóa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(contracts)}">
                        <td colspan="9" class="text-center">Chưa có hợp đồng nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
